name: flag-service

on:
  push:
    branches: [main]
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/_reusable-ci-cd.yml"
  pull_request:
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/_reusable-ci-cd.yml"

permissions:
  id-token: write
  contents: write

jobs:
  ci-cd:
    uses: ./.github/workflows/_reusable-ci-cd.yml
    with:
      service_name: flag-service
      language: python
      working_directory: flag-service
    secrets:
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
      GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
