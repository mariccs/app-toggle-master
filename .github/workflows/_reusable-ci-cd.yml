name: reusable-ci-cd

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      language:
        required: true
        type: string
      working_directory:
        required: true
        type: string
    secrets:
      AWS_GITHUB_ACTIONS_ROLE_ARN:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true
      GITOPS_REPO_TOKEN:
        required: true
      GITOPS_REPO:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - if: inputs.language == 'go'
        run: |
          go mod tidy
          go build ./...
          go vet ./...

      - if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - if: inputs.language == 'python'
        run: |
          pip install -r requirements.txt
          python -m compileall .

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.21"

      - if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ inputs.working_directory }}
          version: latest

      - if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - if: inputs.language == 'python'
        run: |
          pip install flake8
          flake8 . --max-line-length=120

  security-scan:
    name: SAST & SCA
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7

      - name: SCA - Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          severity: CRITICAL
          exit-code: 1

      - if: inputs.language == 'go'
        name: SAST - gosec
        uses: securego/gosec@v2.28.0
        with:
          args: -severity high -confidence high ./...

      - if: inputs.language == 'python'
        name: SAST - bandit
        run: |
          pip install bandit
          bandit -r . --severity-level high

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "image_tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }} \
            --load .

      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL
          exit-code: 1

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Tag & Push
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }} \
            "$REGISTRY/${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}"
          docker push "$REGISTRY/${{ inputs.service_name }}:${{ steps.vars.outputs.image_tag }}"

  update-gitops:
    name: Atualizar tag no repositório GitOps
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Atualizar tag da imagem
        run: |
          cd gitops
          NEW_TAG="${{ needs.docker-build-push.outputs.image_tag }}"
          sed -i -E "s#(${{ inputs.service_name }}:)[a-zA-Z0-9._-]+#\1${NEW_TAG}#" \
            apps/${{ inputs.service_name }}/deployment.yaml

      - name: Commit & push
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/${{ inputs.service_name }}/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(${{ inputs.service_name }}): atualiza imagem para ${{ needs.docker-build-push.outputs.image_tag }}"
          git push
